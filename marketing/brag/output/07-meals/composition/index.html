<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial meals</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-review" src="assets/clips/clip_meal_scroll.mp4" data-start="9.0" data-duration="3.6" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-shutter" src="assets/sfx/click_002.ogg" data-start="6.4" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-review" src="assets/sfx/impactGlass_light_002.ogg" data-start="8.44" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-summary" src="assets/sfx/drop_001.ogg" data-start="14.22" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-card" src="assets/sfx/card-place-1.ogg" data-start="19.49" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-save" src="assets/sfx/click_002.ogg" data-start="22.2" data-track-index="16" data-volume="0.7"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="25.15" data-track-index="17" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '19:34' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('upload', { still: S + 'meal_upload.png' });
      kit.pane('review', clip('clip_meal_scroll', 9.0, 3.6));
      kit.pane('summary', { scroll: { long: S + 'meal_summary.png', top: S + 'meal_summary.png', fixedTop: 112 } });
      kit.pane('card', { still: S + 'meal_review.png' });

      // 1. Hook
      const hook = kit.headline(0.15, 3.1, ['Snap it. Check it.', '<em>Fuel right.</em>'], null, { size: 100, stagger: [0, 0.75] });
      gsap.set(hook, { y: 620, scale: 1.12 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('upload', 0, 'cut');
      kit.phoneIn(1.35);

      // 2. Snap (beat 3.18)
      kit.headline(3.18, 8.44, 'Snap your plate.', 'Or the packet label. FitSocial fills in the macros.');
      kit.touch(6.4, 6.8, 196, 721);

      // 3. The foods (beat 8.44)
      kit.show('review', 8.44);
      kit.headline(8.44, 14.22, 'Every food, itemised.', 'Adjust a portion and the macros follow.');

      // 4. The day (beat 14.22)
      kit.show('summary', 14.22);
      kit.headline(14.22, 19.49, 'Track the day.', 'Every meal against your goals.');
      kit.scroll('summary', 15.6, 18.6, 140, 0);

      // 5. The card (beat 19.49)
      kit.show('card', 19.49, 'fade');
      kit.headline(19.49, 24.7, 'Share the plate.', 'Save the macro card or post it to the feed.');
      kit.punch(20.0, 23.8, 1.14, 196, 250);
      kit.touch(22.2, 22.55, 108, 380);

      // 6. End card
      kit.phoneOut(24.7);
      kit.wordmark(25.15, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
