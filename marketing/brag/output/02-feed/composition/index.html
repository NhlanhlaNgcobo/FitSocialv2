<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial feed</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-feed" src="assets/clips/clip_home_scroll.mp4" data-start="3.5" data-duration="4.2" muted playsinline></video>
      <video id="clip-react" src="assets/clips/clip_react.mp4" data-start="8.9" data-duration="2.4" muted playsinline></video>
      <video id="clip-tag" src="assets/clips/clip_tag.mp4" data-start="19.9" data-duration="3.5" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-9-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-react-in" src="assets/sfx/drop_001.ogg" data-start="8.44" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-hold" src="assets/sfx/select_008.ogg" data-start="9.7" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-picked" src="assets/sfx/impactGlass_light_002.ogg" data-start="11.35" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-comments" src="assets/sfx/card-slide-2.ogg" data-start="14.22" data-track-index="15" data-volume="0.55"></audio>
      <audio id="sfx-reply" src="assets/sfx/click_002.ogg" data-start="16.9" data-track-index="16" data-volume="0.7"></audio>
      <audio id="sfx-compose" src="assets/sfx/drop_002.ogg" data-start="19.48" data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-tag-1" src="assets/sfx/card-place-1.ogg" data-start="21.63" data-track-index="18" data-volume="0.55"></audio>
      <audio id="sfx-tag-2" src="assets/sfx/card-place-1.ogg" data-start="22.03" data-track-index="19" data-volume="0.55"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="26.2" data-track-index="20" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('feed', clip('clip_home_scroll', 3.5, 4.2));
      kit.pane('react', clip('clip_react', 8.9, 2.4));
      kit.pane('reacted', { still: S + 'react_done.png' });
      kit.pane('comments', { still: S + 'comments.png' });
      kit.pane('reply', { still: S + 'comments_reply.png' });
      kit.pane('tag', clip('clip_tag', 19.9, 3.5));

      // 1. Hook
      const hook = kit.headline(0.15, 3.1, ['Progress is', '<em>better together.</em>'], null, { size: 100, stagger: [0, 0.7] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('feed', 0, 'cut');
      kit.phoneIn(1.35);

      // 2. The feed (beat 3.18)
      kit.headline(3.18, 8.44, "Your crew's feed.", 'Runs, lifts and meals from the people you follow.');

      // 3. Reactions (strong beat 8.44): hold the heart, glide across the
      // seven, settle on the fire. Tray centres read off the clip.
      kit.show('react', 8.44, 'fade');
      kit.headline(8.44, 14.22, 'Hold to react.', 'Seven reactions. Pick yours.');
      kit.drag([[9.1, 40, 715], [9.7, 40, 628], [10.77, 280, 628], [11.03, 81, 628]], 11.3);
      kit.show('reacted', 11.35, 'fade');

      // 4. Comments (beat 14.22), then the reply banner.
      kit.show('comments', 14.22, 'fade');
      kit.headline(14.22, 19.48, 'Reply in threads.', 'Replies sit under the comment they answer.');
      kit.touch(16.6, 16.85, 49, 241);
      kit.show('reply', 16.9, 'cut');

      // 5. Tagging (beat 19.48)
      kit.show('tag', 19.48);
      kit.headline(19.48, 25.8, 'Tag your crew.', 'Tagged friends get a notification.');

      // 6. End card
      kit.phoneOut(25.8);
      kit.wordmark(26.2, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
