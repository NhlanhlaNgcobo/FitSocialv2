<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial onboarding</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bolditalic.ttf'); font-weight: 700; font-style: italic; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-splash" src="assets/clips/clip_splash.mp4" data-start="1.4" data-duration="1.8" muted playsinline></video>
      <video id="clip-welcome" src="assets/clips/clip_welcome.mp4" data-start="3.27" data-duration="2.5" muted playsinline></video>
      <video id="clip-profile" src="assets/clips/clip_profile_typing.mp4" data-start="13.5" data-duration="3.5" muted playsinline></video>
      <video id="clip-feed" src="assets/clips/clip_home_scroll.mp4" data-start="20.1" data-duration="4.2" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-duration="0.6" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-welcome" src="assets/sfx/drop_001.ogg" data-start="3.27" data-duration="0.6" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-signup" src="assets/sfx/drop_002.ogg" data-start="8.74" data-duration="0.6" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-tap" src="assets/sfx/click_002.ogg" data-start="11.55" data-duration="0.3" data-track-index="14" data-volume="0.75"></audio>
      <audio id="sfx-profile" src="assets/sfx/drop_001.ogg" data-start="13.11" data-duration="0.6" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-available" src="assets/sfx/impactGlass_light_002.ogg" data-start="16.95" data-duration="0.8" data-track-index="16" data-volume="0.55"></audio>
      <audio id="sfx-feed" src="assets/sfx/drop_002.ogg" data-start="19.66" data-duration="0.6" data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="26.45" data-duration="2.6" data-track-index="18" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      // The app's own first-run screens, in order.
      kit.pane('splash', clip('clip_splash', 1.4, 1.8));
      kit.pane('welcome', clip('clip_welcome', 3.27, 2.5));
      kit.pane('signup', { still: S + 'signup.png' });
      kit.pane('profile', clip('clip_profile_typing', 13.5, 3.5));
      kit.pane('feed', clip('clip_home_scroll', 20.1, 4.2));

      // 1. Hook
      const hook = kit.headline(0.15, 3.2, ['Your crew is', '<em>already here.</em>'], null, { size: 104, stagger: [0, 0.7] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('splash', 0, 'cut');
      kit.phoneIn(1.35);

      // 2. Welcome (beat 3.27)
      kit.show('welcome', 3.27, 'fade');
      kit.headline(3.27, 8.74, 'Built for how you train.', 'Runs, lifts, meals and the people you do them with.');

      // 3. Sign up (strong beat 8.74). A thumb on "Sign up with Google".
      kit.show('signup', 8.74);
      kit.headline(8.74, 13.11, 'One tap to join.', 'Sign up with Google or with email.');
      kit.touch(11.55, 12.1, 196, 709);

      // 4. Profile (strong beat 13.11): the name typed in, the handle checked.
      kit.show('profile', 13.11);
      kit.headline(13.11, 19.66, 'Make it yours.', "Pick a name and a handle. We check it's free.");

      // 5. Feed (strong beat 19.66)
      kit.show('feed', 19.66);
      kit.headline(19.66, 26.0, 'Land in your feed.', "Your crew's runs, lifts and meals, first thing.");

      // 6. End card
      kit.phoneOut(26.0);
      kit.wordmark(26.45, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
