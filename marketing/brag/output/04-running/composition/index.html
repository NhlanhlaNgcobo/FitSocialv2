<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial run tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-finish" src="assets/clips/clip_finish_scroll.mp4" data-start="23.2" data-duration="3.2" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.36" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.65"></audio>
      <audio id="sfx-live" src="assets/sfx/drop_001.ogg" data-start="3.27" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-map" src="assets/sfx/impactSoft_medium_003.ogg" data-start="8.74" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-tread" src="assets/sfx/drop_002.ogg" data-start="13.11" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-import" src="assets/sfx/card-place-1.ogg" data-start="17.47" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-finish" src="assets/sfx/drop_001.ogg" data-start="22.93" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="27.1" data-track-index="17" data-volume="0.75"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('bigmap', { still: S + 'live_map.png' });
      kit.pane('live', { still: S + 'live_run.png' });
      kit.pane('map', { still: S + 'live_map.png' });
      kit.pane('tread', { still: S + 'treadmill.png' });
      kit.pane('drafts', { still: S + 'create_drafts.png' });
      kit.pane('finish', clip('clip_finish_scroll', 23.2, 3.2));

      // 1. Hook: the route on real Durban streets, slowly closing in.
      const hook = kit.headline(0.15, 3.2, ['Every kilometre', '<em>counts.</em>'], null, { size: 104, stagger: [0, 0.75] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('bigmap', 0, 'cut');
      kit.phoneIn(1.35);
      kit.punch(1.5, 3.2, 1.1, 196, 460);

      // 2. Live (beat 3.27)
      kit.show('live', 3.27, 'fade');
      kit.headline(3.27, 8.74, 'Track it live.', 'GPS route, pace and time as you run.');
      kit.punch(4.2, 7.7, 1.1, 196, 330);

      // 3. Full-screen map (strong beat 8.74), from the expand button.
      kit.touch(8.2, 8.6, 353, 150);
      kit.show('map', 8.74, 'fade');
      kit.headline(8.74, 13.11, 'Go full screen.', 'Your route on the map, the numbers up top.');

      // 4. Treadmill (strong beat 13.11)
      kit.show('tread', 13.11);
      kit.headline(13.11, 17.47, 'Treadmill? Covered.', 'Match the distance on the display.');

      // 5. Imported runs (strong beat 17.47)
      kit.show('drafts', 17.47);
      kit.headline(17.47, 22.93, 'Watch runs land here.', 'Runs from your watch or Samsung Health wait in Create.');

      // 6. The card (strong beat 22.93)
      kit.show('finish', 22.93);
      kit.headline(22.93, 26.7, 'Save the card.', 'Save to Photos or share it anywhere.');

      // 7. End card
      kit.phoneOut(26.7);
      kit.wordmark(27.1, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
