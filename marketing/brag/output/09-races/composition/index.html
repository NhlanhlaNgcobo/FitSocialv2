<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial races</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-list" src="assets/clips/clip_races_scroll.mp4" data-start="3.6" data-duration="4.0" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.36" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.65"></audio>
      <audio id="sfx-list" src="assets/sfx/drop_001.ogg" data-start="3.27" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-detail" src="assets/sfx/impactSoft_medium_003.ogg" data-start="8.74" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-saved" src="assets/sfx/card-place-1.ogg" data-start="13.11" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-submit" src="assets/sfx/drop_002.ogg" data-start="17.47" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="23.35" data-track-index="16" data-volume="0.75"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('countdown', { still: S + 'races_saved.png' });
      kit.pane('list', clip('clip_races_scroll', 3.6, 4.0));
      kit.pane('detail', { still: S + 'race_detail.png' });
      kit.pane('saved', { still: S + 'races_saved.png' });
      kit.pane('submit', { still: S + 'race_submit.png' });

      // 1. Hook: straight onto the countdown.
      const hook = kit.headline(0.15, 3.2, ['Your next', '<em>start line.</em>'], null, { size: 110, stagger: [0, 0.75] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('countdown', 0, 'cut');
      kit.phoneIn(1.35);
      kit.punch(1.9, 3.2, 1.08, 196, 330);

      // 2. The calendar (beat 3.27)
      kit.show('list', 3.27, 'fade');
      kit.headline(3.27, 8.74, 'Every race, one calendar.', 'Filter by date, distance and qualifier.');

      // 3. A race (strong beat 8.74)
      kit.show('detail', 8.74);
      kit.headline(8.74, 13.11, 'Pick your distance.', 'Start times, prices and where it starts.');
      kit.punch(9.4, 12.8, 1.08, 196, 520);

      // 4. Saved (strong beat 13.11)
      kit.show('saved', 13.11);
      kit.headline(13.11, 17.47, 'Save it. Count it down.', 'My Races counts the days to your next one.');

      // 5. Submit (strong beat 17.47)
      kit.show('submit', 17.47);
      kit.headline(17.47, 22.93, 'Missing one? Add it.', "Submit a race. It's checked before it goes live.");

      // 6. End card (strong beat 22.93)
      kit.phoneOut(22.93);
      kit.wordmark(23.35, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
