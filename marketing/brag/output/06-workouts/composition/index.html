<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial workouts</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-build" src="assets/clips/clip_workout_build.mp4" data-start="3.3" data-duration="4.33" muted playsinline></video>
      <video id="clip-repeat" src="assets/clips/clip_workout_repeat.mp4" data-start="9.3" data-duration="2.0" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-lift-1" src="assets/sfx/chips-stack-3.ogg" data-start="4.77" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-lift-2" src="assets/sfx/chips-stack-3.ogg" data-start="5.9" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-lift-3" src="assets/sfx/chips-stack-3.ogg" data-start="7.03" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-repeat-in" src="assets/sfx/drop_001.ogg" data-start="9.02" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-chip" src="assets/sfx/click_002.ogg" data-start="9.7" data-track-index="16" data-volume="0.7"></audio>
      <audio id="sfx-health" src="assets/sfx/drop_002.ogg" data-start="14.02" data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-feed" src="assets/sfx/card-place-1.ogg" data-start="19.02" data-track-index="18" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="25.4" data-track-index="19" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '17:48' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('build', clip('clip_workout_build', 3.3, 4.33));
      kit.pane('repeat', clip('clip_workout_repeat', 9.3, 2.0));
      kit.pane('health', { still: S + 'workout_log.png' });
      kit.pane('feed', { still: C + 'clip_home_scroll_last.png' });

      // 1. Hook
      const hook = kit.headline(0.15, 2.95, ['Leg day.', '<em>Logged and posted.</em>'], null, { size: 104, stagger: [0, 0.7] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('build', 0, 'cut');
      kit.phoneIn(1.35);

      // 2. Building the log (beat 3.02): three lifts through the add sheet.
      kit.headline(3.02, 9.02, 'Log every lift.', 'Sets, reps and weight. Volume adds itself up.');

      // 3. Repeat (beat 9.02): the Leg Day chip refills the form.
      kit.show('repeat', 9.02);
      kit.headline(9.02, 14.02, 'Repeat a session.', "One tap refills a workout you've done before.");
      kit.touch(9.7, 10.05, 268, 315);

      // 4. From a watch (beat 14.02)
      kit.show('health', 14.02, 'fade');
      kit.headline(14.02, 19.02, 'Pull it from your watch.', 'Fill it from Samsung Health or your watch.');
      kit.punch(14.6, 18.6, 1.18, 196, 215);

      // 5. In the feed (beat 19.02)
      kit.show('feed', 19.02);
      kit.headline(19.02, 25.0, 'Post it as a log sheet.', 'Your crew sees every set.');

      // 6. End card
      kit.phoneOut(25.0);
      kit.wordmark(25.4, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
