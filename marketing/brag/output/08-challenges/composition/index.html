<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial challenges</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-create" src="assets/clips/clip_challenge_create.mp4" data-start="3.3" data-duration="3.67" muted playsinline></video>
      <video id="clip-board" src="assets/clips/clip_challenge_scroll.mp4" data-start="13.3" data-duration="2.2" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.36" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.0" data-track-index="11" data-volume="0.65"></audio>
      <audio id="sfx-create" src="assets/sfx/drop_001.ogg" data-start="3.01" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-invite" src="assets/sfx/card-slide-2.ogg" data-start="8.73" data-track-index="13" data-volume="0.65"></audio>
      <audio id="sfx-accept" src="assets/sfx/click_002.ogg" data-start="11.2" data-track-index="14" data-volume="0.75"></audio>
      <audio id="sfx-board" src="assets/sfx/chips-stack-3.ogg" data-start="12.56" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-live" src="assets/sfx/drop_002.ogg" data-start="18.01" data-track-index="16" data-volume="0.65"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="23.35" data-track-index="17" data-volume="0.75"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '06:15' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('hub', { still: S + 'challenge_hub.png' });
      kit.pane('create', clip('clip_challenge_create', 3.3, 3.67));
      kit.pane('invite', { still: S + 'challenge_invite.png' });
      kit.pane('board', clip('clip_challenge_scroll', 13.3, 2.2));
      kit.pane('live', { still: S + 'challenge_live.png' });

      // 1. Hook
      const hook = kit.headline(0.15, 2.95, ['Call out', '<em>your friends.</em>'], null, { size: 110, stagger: [0, 0.6] });
      gsap.set(hook, { y: 620, scale: 1.15 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.65, ease: 'power3.inOut' }, 1.0);
      kit.show('hub', 0, 'cut');
      kit.phoneIn(1.2);

      // 2. Create (beat 3.01)
      kit.show('create', 3.01);
      kit.headline(3.01, 8.73, 'Set the goal.', 'Distance, dates, public or private.');

      // 3. Invite (beat 8.73)
      kit.show('invite', 8.73);
      kit.headline(8.73, 12.56, 'They get the invite.', 'Accept or decline, right on the board.');
      kit.touch(11.2, 11.6, 114, 382);

      // 4. Board (beat 12.56)
      kit.show('board', 12.56);
      kit.headline(12.56, 18.01, 'Race the leaderboard.', 'Streaks, days and kilometres, ranked.');

      // 5. Live (strong beat 18.01)
      kit.show('live', 18.01);
      kit.headline(18.01, 22.92, 'Or join one.', 'Public challenges are open to anyone.');

      // 6. End card (strong beat 22.92)
      kit.phoneOut(22.92);
      kit.wordmark(23.35, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
