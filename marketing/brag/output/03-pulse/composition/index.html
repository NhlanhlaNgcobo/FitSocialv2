<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial Pulse</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-compose" src="assets/clips/clip_pulse_text.mp4" data-start="3.3" data-duration="3.73" muted playsinline></video>
      <video id="clip-viewer" src="assets/clips/clip_pulse_play.mp4" data-start="8.73" data-duration="2.6" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.36" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.0" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-compose" src="assets/sfx/drop_001.ogg" data-start="3.01" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-font" src="assets/sfx/select_008.ogg" data-start="5.53" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-strong" src="assets/sfx/select_008.ogg" data-start="6.1" data-track-index="14" data-volume="0.55"></audio>
      <audio id="sfx-viewer" src="assets/sfx/card-slide-2.ogg" data-start="8.73" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-share-in" src="assets/sfx/drop_002.ogg" data-start="12.56" data-track-index="16" data-volume="0.65"></audio>
      <audio id="sfx-share" src="assets/sfx/click_002.ogg" data-start="16.3" data-track-index="17" data-volume="0.75"></audio>
      <audio id="sfx-viewers" src="assets/sfx/card-place-1.ogg" data-start="18.01" data-track-index="18" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="23.35" data-track-index="19" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      kit.pane('tray', { still: C + 'clip_home_scroll_first.png' });
      kit.pane('compose', clip('clip_pulse_text', 3.3, 3.73));
      kit.pane('viewer', clip('clip_pulse_play', 8.73, 2.6));
      kit.pane('share', { still: S + 'pulse_share_post.png' });
      kit.pane('viewers', { still: S + 'pulse_own_viewers.png' });

      // 1. Hook: straight into the rings at the top of Home.
      const hook = kit.headline(0.15, 2.95, ['Post the moment.', '<em>Not the whole workout.</em>'], null, { size: 90, stagger: [0, 0.65] });
      gsap.set(hook, { y: 620, scale: 1.12 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.05);
      kit.show('tray', 0, 'cut');
      kit.phoneIn(1.25);
      kit.punch(2.0, 2.95, 1.12, 196, 170);

      // 2. Writing a Pulse (beat 3.01): typed, Neon, then Strong, Done.
      kit.show('compose', 3.01, 'fade');
      kit.headline(3.01, 8.73, 'Say it in a Pulse.', 'Six typefaces. Twelve colours.');

      // 3. Watching one (beat 8.73)
      kit.show('viewer', 8.73);
      kit.headline(8.73, 12.56, 'Up for 24 hours.', 'Then it is gone.');

      // 4. Sharing a post to it (beat 12.56)
      kit.show('share', 12.56);
      kit.headline(12.56, 18.01, 'Share any post to it.', 'The author gets told.');
      kit.touch(16.3, 16.75, 196, 781);

      // 5. Your own, and who saw it (strong beat 18.01)
      kit.show('viewers', 18.01);
      kit.headline(18.01, 22.92, 'See who watched.', 'Your Pulse lists who viewed it.');

      // 6. End card (strong beat 22.92)
      kit.phoneOut(22.92);
      kit.wordmark(23.35, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
