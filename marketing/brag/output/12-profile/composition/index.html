<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial profile</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.2" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-profile" src="assets/sfx/drop_001.ogg" data-start="3.18" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-badges" src="assets/sfx/impactGlass_light_002.ogg" data-start="8.44" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-circle" src="assets/sfx/drop_002.ogg" data-start="14.22" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-follow" src="assets/sfx/click_002.ogg" data-start="17.4" data-track-index="15" data-volume="0.7"></audio>
      <audio id="sfx-worm" src="assets/sfx/card-place-1.ogg" data-start="19.48" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="25.1" data-track-index="17" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '06:04' });
      const tl = kit.tl;
      const S = 'assets/screens/';

      kit.pane('hero', { still: S + 'profile.png' });
      kit.pane('badges', { scroll: { long: S + 'achievements.png', top: S + 'achievements.png', fixedTop: 112 } });
      kit.pane('circle', { still: S + 'connections.png' });
      kit.pane('worm', { still: S + 'challenge_hub.png' });

      // 1. Hook
      const hook = kit.headline(0.15, 3.1, ['Proof', '<em>you showed up.</em>'], null, { size: 110, stagger: [0, 0.7] });
      gsap.set(hook, { y: 620, scale: 1.12 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.1);
      kit.show('hero', 0, 'cut');
      kit.phoneIn(1.35);

      // 2. The profile (beat 3.18): push into the run grid.
      kit.headline(3.18, 8.44, 'Every run, on your profile.', 'Workouts, runs and meals, each in its own tab.');
      kit.punch(3.8, 8.1, 1.12, 196, 640);

      // 3. Badges (beat 8.44)
      kit.show('badges', 8.44);
      kit.headline(8.44, 14.22, 'Earn the badges.', 'Pulse 75, Early Worm and more, with your points.');

      // 4. Circle (beat 14.22)
      kit.show('circle', 14.22);
      kit.headline(14.22, 19.48, 'Your circle.', 'Followers and following. One tap to follow back.');
      kit.touch(17.4, 17.75, 318, 395);

      // 5. Early Worm (beat 19.48)
      kit.show('worm', 19.48);
      kit.headline(19.48, 24.7, 'Up before 6?', 'Post a Pulse between 4 and 6 AM and the day counts.');
      kit.punch(20.0, 24.3, 1.12, 196, 360);

      // 6. End card
      kit.phoneOut(24.7);
      kit.wordmark(25.1, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
