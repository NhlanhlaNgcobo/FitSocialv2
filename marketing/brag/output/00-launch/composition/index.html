<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FitSocial launch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-Regular.ttf'); }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-medium.ttf'); font-weight: 500; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bold.ttf'); font-weight: 700; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-bolditalic.ttf'); font-weight: 700; font-style: italic; }
      @font-face { font-family: 'Roboto'; src: url('assets/fonts/roboto-blackitalic.ttf'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; padding: 0; background: #050505; }
    </style>
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <script src="assets/audio-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- clips -->
      <video id="clip-feed" src="assets/clips/clip_home_scroll.mp4" data-start="3.4" data-duration="4.2" muted playsinline></video>
      <video id="clip-meal" src="assets/clips/clip_meal_scroll.mp4" data-start="13.9" data-duration="3.6" muted playsinline></video>
      <video id="clip-pulse" src="assets/clips/clip_pulse_play.mp4" data-start="18.02" data-duration="2.6" muted playsinline></video>
      <video id="clip-board" src="assets/clips/clip_challenge_scroll.mp4" data-start="20.8" data-duration="2.2" muted playsinline></video>
      <video id="clip-safety" src="assets/clips/clip_sos_hold.mp4" data-start="23.4" data-duration="2.2" muted playsinline></video>
      <!-- /clips -->
      <audio id="music" src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="sfx-land" src="assets/sfx/impactSoft_medium_001.ogg" data-start="2.1" data-duration="0.6" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-run" src="assets/sfx/drop_001.ogg" data-start="8.0" data-duration="0.6" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-meal" src="assets/sfx/drop_002.ogg" data-start="13.0" data-duration="0.6" data-track-index="13" data-volume="0.65"></audio>
      <audio id="sfx-pulse" src="assets/sfx/drop_001.ogg" data-start="18.0" data-duration="0.6" data-track-index="14" data-volume="0.65"></audio>
      <audio id="sfx-board" src="assets/sfx/drop_002.ogg" data-start="20.5" data-duration="0.6" data-track-index="15" data-volume="0.65"></audio>
      <audio id="sfx-safety" src="assets/sfx/drop_001.ogg" data-start="23.0" data-duration="0.6" data-track-index="16" data-volume="0.65"></audio>
      <audio id="sfx-press" src="assets/sfx/click_002.ogg" data-start="23.7" data-duration="0.3" data-track-index="17" data-volume="0.75"></audio>
      <audio id="sfx-sent" src="assets/sfx/impactSoft_medium_001.ogg" data-start="25.65" data-duration="0.6" data-track-index="18" data-volume="0.7"></audio>
      <audio id="sfx-bell" src="assets/sfx/impactBell_heavy_000.ogg" data-start="27.2" data-duration="2.6" data-track-index="19" data-volume="0.7"></audio>
    </div>
    <script>
      const root = document.getElementById('root');
      const kit = FitKit.create(root, { phoneWidth: 640, phoneTop: 470, statusTime: '05:42' });
      const tl = kit.tl;
      const C = 'assets/clips/';
      const S = 'assets/screens/';
      const clip = (name, start, dur) => ({ video: { src: C + name + '.mp4', first: C + name + '_first.png', last: C + name + '_last.png', start: start, dur: dur } });

      // Screens, all rendered from the app's own widgets.
      kit.pane('feed', clip('clip_home_scroll', 3.4, 4.2));
      kit.pane('run', { still: S + 'live_run.png' });
      kit.pane('meal', clip('clip_meal_scroll', 13.9, 3.6));
      kit.pane('pulse', clip('clip_pulse_play', 18.02, 2.6));
      kit.pane('board', clip('clip_challenge_scroll', 20.8, 2.2));
      kit.pane('safety', clip('clip_sos_hold', 23.4, 2.2));
      kit.pane('sent', { still: S + 'panic_sent.png' });

      // 1. Hook
      // Opens big in the middle of the frame, then rides up as the phone rises.
      const hook = kit.headline(0.15, 2.95, ['Your whole', 'fitness life.', '<em>One feed.</em>'], null, { size: 92, stagger: [0, 0.12, 0.95] });
      gsap.set(hook, { y: 620, scale: 1.22 });
      tl.to(hook, { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, 1.25);
      kit.show('feed', 0, 'cut');
      kit.phoneIn(1.5);

      // 2. Feed (beat-locked: 3.02)
      kit.headline(3.02, 8.02, 'Runs. Lifts. Meals.', 'From the people you train with.');

      // 3. Train (beat-locked: 8.02)
      kit.show('run', 8.02);
      kit.headline(8.02, 13.01, 'Track it live.', 'Route, pace and time while you run.');
      kit.punch(8.7, 12.7, 1.12, 196, 330);

      // 4. Fuel (beat-locked: 13.01)
      kit.show('meal', 13.01);
      kit.headline(13.01, 18.02, 'Snap the plate.', 'Every food itemised. Macros added up.');

      // 5. Share (beat-locked: 18.02 strong, 20.52)
      kit.show('pulse', 18.02);
      kit.headline(18.02, 20.52, 'Post the moment.', 'Pulses stay up for 24 hours.');
      kit.show('board', 20.52);
      kit.headline(20.52, 23.02, 'Call out your crew.', 'Set a goal. Race your friends to it.');

      // 6. Safe (beat-locked: 23.02 strong). The finger lands on the 10th
      // frame of the hold clip.
      kit.show('safety', 23.02);
      kit.headline(23.02, 26.9, 'Hold for 2 seconds.', 'A silent alert with your live location.');
      kit.touch(23.7, 25.55, 196, 200);
      kit.show('sent', 25.65, 'fade');

      // 7. End card
      kit.phoneOut(26.85);
      kit.wordmark(27.2, 128, 'assets/fitsocial_f_mark.png', 'Train. Fuel. Share. Grow.');

      kit.breathe(window.AUDIO_DATA, 0, 30);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
