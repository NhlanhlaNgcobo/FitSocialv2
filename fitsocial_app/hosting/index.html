<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitSocial</title>
<meta name="description" content="Track runs and workouts with the people you train with.">
<meta property="og:site_name" content="FitSocial">
<meta property="og:title" content="FitSocial">
<meta property="og:description" content="Track runs and workouts with the people you train with.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(120% 80% at 50% 0%, #2a1a0f 0%, #050505 60%);
    color: #f7f7f7; text-align: center;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  .mark {
    width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 22px;
    background: linear-gradient(135deg, #ff6b1a, #d35400);
    display: grid; place-items: center; font-size: 38px; line-height: 1;
    box-shadow: 0 12px 40px rgba(255, 107, 26, 0.32);
  }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
  p { margin: 0 0 28px; color: #aaaaaa; font-size: 14.5px; }
  a {
    display: block; max-width: 340px; margin: 0 auto; padding: 15px 20px;
    border-radius: 16px; background: #ff6b1a; color: #050505;
    text-decoration: none; font-weight: 700; font-size: 15px;
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">⚡</div>
  <h1>FitSocial</h1>
  <p>Track runs and workouts with the people you train with.</p>
  <a href="https://play.google.com/store/apps/details?id=com.fitsocial.fitsocial_app">Get FitSocial</a>
</main>
</body>
</html>
