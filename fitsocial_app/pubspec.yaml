name: fitsocial_app
description: FitSocial mobile app foundation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  flutter_riverpod: ^2.5.1
  geolocator: ^14.0.2
  go_router: ^14.2.0
  google_maps_flutter: ^2.17.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.2
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/welcome_reference_athlete.png
