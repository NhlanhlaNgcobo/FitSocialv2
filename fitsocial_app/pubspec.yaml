name: fitsocial_app
description: FitSocial mobile app foundation.
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.3.1
  # Crash and non-fatal error reporting. Carries the release's R8 mapping, so a
  # tester's obfuscated stack trace arrives readable — see uploadCrashlyticsMappingFile
  # in android/app/build.gradle.kts.
  firebase_crashlytics: ^4.3.10
  firebase_core: ^3.6.0
  # Push notifications. Only the registration token and the tap callbacks are
  # used from here: the tray entry itself is drawn by Android from the payload,
  # which is why there is no local-notifications plugin beside this one.
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.6.2
  firebase_storage: ^12.3.3
  # Platform-agnostic file handle. XFile.readAsBytes() works on mobile and web
  # alike, which lets uploads use putData instead of dart:io's File.
  cross_file: ^0.3.5
  # Disk cache for remote photos. Flutter's built-in image cache is memory-only
  # and dies with the process, so without this every photo is re-downloaded on
  # each cold start. See shared/widgets/app_photo.dart.
  cached_network_image: ^3.4.1
  # Used by ble_heart_rate_service.dart for device identifiers.
  uuid: ^4.5.1
  flutter_riverpod: ^2.5.1
  geolocator: ^14.0.2
  go_router: ^14.2.0
  google_maps_flutter: ^2.17.0
  google_sign_in: ^6.2.1
  # Writes the exported run card to the device gallery. Chosen over
  # image_gallery_saver, which is unmaintained and has no AGP 8 namespace, and
  # over hand-rolling it with permission_handler: MediaStore needs no permission
  # from API 29 and WRITE_EXTERNAL_STORAGE below it, and this already knows the
  # difference.
  gal: ^2.3.0
  image_picker: ^1.2.2
  pedometer: ^4.0.2
  sensors_plus: ^6.1.1
  package_info_plus: ">=8.1.0"
  health: 13.2.0
  flutter_blue_plus: 1.35.5
  permission_handler: ^12.0.3
  flutter_web_auth_2: ^5.0.3
  flutter_secure_storage: ^10.3.1
  # Where offline run drafts and the live-run checkpoint are written. Already
  # present transitively via image_picker; named here because the app now
  # calls it directly.
  path_provider: ^2.1.4
  crypto: ^3.0.7
  http: ^1.6.0
  # JPEG encoding for the framed Pulse photo. Flutter's own toByteData only
  # emits PNG, and a full-screen photographic PNG runs to several megabytes —
  # too much to push through a story upload. Pure Dart on purpose: a native
  # compressor would add another Android build surface to a Gradle setup that
  # has already cost us enough.
  image: ^4.5.4
  # Pulse playback: video segments in the viewer and the composer preview.
  video_player: ^2.9.2
  # Renders the Spotify / Apple Music / YouTube Music marks from their official
  # vector outlines, so the connect buttons stay sharp at any size.
  flutter_svg: ^2.0.10
  spotify_sdk: ^3.0.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  # The "Send alert" entry on the app icon's long-press menu. The Flutter
  # team's own package, over Android app shortcuts and iOS Home Screen Quick
  # Actions: the one silent-alert trigger that works the same on both.
  quick_actions: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Already pulled in by flutter_test; named here so a test may import it
  # directly to drive the live-share write throttle under a fake clock.
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/welcome_reference_athlete.png
  shaders:
    - assets/shaders/liquid_glass.frag
  # The Pulse text tool's typefaces. Bundled rather than fetched at runtime so
  # a written Pulse never flashes the fallback face while a download lands, on
  # either the composer or the viewer. All SIL OFL; licences sit beside them.
  fonts:
    - family: PulseModern
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: PulseNeon
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: PulseTypewriter
      fonts:
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: PulseStrong
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: PulseElegant
      fonts:
        - asset: assets/fonts/PlayfairDisplay-ItalicVariable.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
