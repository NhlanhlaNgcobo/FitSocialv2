name: fitsocial_app
description: FitSocial mobile app foundation.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.6.2
  firebase_storage: ^12.3.3
  flutter_riverpod: ^2.5.1
  geolocator: ^14.0.2
  go_router: ^14.2.0
  google_maps_flutter: ^2.17.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.2
  pedometer: ^4.0.2
  sensors_plus: ^6.1.1
  package_info_plus: ">=8.1.0"
  health: 13.2.0
  flutter_blue_plus: 1.35.5
  permission_handler: ^12.0.3
  flutter_web_auth_2: ^5.0.3
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/welcome_reference_athlete.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
